server:
  port: 8080

spring:
  application:
    name: college-lost-and-found-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/college_lost_and_found?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Custom Application Properties
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # 24 hours in milliseconds (86400000)
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    initial-email: ${INITIAL_ADMIN_EMAIL:admin@college.edu.in}
    initial-password: ${INITIAL_ADMIN_PASSWORD:Admin@Campus2026}
    initial-name: Campus Administrator
    initial-id: ADM-001
    initial-department: Campus Administration
